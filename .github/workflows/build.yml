name: Build CF-IP-Picker APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). 留空则只构建不上传'
        required: false
        default: ''
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              cp "$APK" "cf-ip-picker_${{ github.event.inputs.version }}.apk"
            else
              cp "$APK" "cf-ip-picker.apk"
            fi
            ls -lh cf-ip-picker*.apk
          fi

      # 不传 version 时:上传 artifact(push 触发,便于日常构建)
      - name: Upload APK artifact (dev)
        if: github.event.inputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: cf-ip-picker-apk
          path: "cf-ip-picker.apk"
          retention-days: 7

      # 传 version 时:直接创建 GitHub Release(绕开 artifact 配额)
      - name: Create Release
        if: github.event.inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.version }}" \
            "cf-ip-picker_${{ github.event.inputs.version }}.apk" \
            --repo "${{ github.repository }}" \
            --title "CF优选IP ${{ github.event.inputs.version }}" \
            --notes "CF优选IP 逆向重写版 - 纯 Kotlin + Jetpack Compose" \
            --generate-notes || true
